name: Publish v1.2.0
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package skill
        run: |
          mkdir -p dist/map-picture
          cp -r SKILL.md agents examples references scripts README.md dist/map-picture/
          cd dist
          zip -r map-picture.zip map-picture
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0 dist/map-picture.zip --target "$GITHUB_SHA" --title "map-picture v1.2.0" --notes "Editorial Photography / Travel Zine skill. Includes original-photo preservation, real geographic overlays, composition review and map contrast guidance. See README for installation and current Windows renderer limitations."
